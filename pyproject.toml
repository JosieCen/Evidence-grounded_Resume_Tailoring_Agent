[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-grounded-resume-tailoring-agent"
version = "0.3.0"
description = "A privacy-safe showcase agent for evidence-grounded resume tailoring with structured JD analysis, semantic retrieval, controlled rewriting, deterministic guardrails, and evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "JosieCen"}]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]
ui = ["streamlit>=1.40,<2"]
embedding = ["sentence-transformers>=6.0,<7"]

[project.scripts]
resume-agent = "evidence_grounded_resume_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
