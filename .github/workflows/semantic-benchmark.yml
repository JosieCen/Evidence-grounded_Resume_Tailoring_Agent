name: Semantic Retrieval Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "src/evidence_grounded_resume_agent/retrieval.py"
      - "src/evidence_grounded_resume_agent/retrieval_evaluation.py"
      - "examples/retrieval_benchmark.yaml"
      - "pyproject.toml"
      - ".github/workflows/semantic-benchmark.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[embedding]"
      - name: Run embedding benchmark
        run: |
          resume-agent benchmark-retrieval \
            --profile examples/fictional_profile.yaml \
            --benchmark examples/retrieval_benchmark.yaml \
            --retriever embedding \
            --output outputs/embedding_benchmark.json
      - name: Run hybrid benchmark
        run: |
          resume-agent benchmark-retrieval \
            --profile examples/fictional_profile.yaml \
            --benchmark examples/retrieval_benchmark.yaml \
            --retriever hybrid \
            --output outputs/hybrid_benchmark.json
      - name: Print benchmark results
        run: |
          cat outputs/embedding_benchmark.json
          cat outputs/hybrid_benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-retrieval-benchmark
          path: |
            outputs/embedding_benchmark.json
            outputs/hybrid_benchmark.json
