name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - name: Run baseline-aware demo
        run: |
          resume-agent run \
            --profile examples/fictional_profile.yaml \
            --jd examples/fictional_jd.md \
            --baseline examples/fictional_baseline_resume.yaml \
            --output outputs/demo
      - name: Verify rewrite-based unsafe-draft recovery
        run: |
          resume-agent run \
            --profile examples/fictional_profile.yaml \
            --jd examples/fictional_jd.md \
            --baseline examples/fictional_baseline_resume.yaml \
            --output outputs/unsafe_demo \
            --simulate-unsafe-draft
      - run: resume-agent evaluate --profile examples/fictional_profile.yaml --output outputs/evaluation.json
      - run: resume-agent benchmark-retrieval --profile examples/fictional_profile.yaml --benchmark examples/retrieval_benchmark.yaml --retriever lexical --output outputs/lexical_benchmark.json
