entities:
- id: exp_medical_ai_lab
  title: Medical AI Evaluation Research Assistant
  organization: Example Clinical AI Laboratory
  category: experience
  claims:
  - id: claim_workflow_eval
    text: Defined model evaluation plans around clinical workflows and translated medical needs into testable product requirements.
    evidence_refs: [protocol_v1, evaluation_plan]
    tags: [clinical, evaluation, product, requirement, workflow, user needs]
    paraphrases:
    - Translated clinical workflow needs into testable product requirements and evaluation plans.
    - Converted medical user needs into concrete product requirements for model evaluation.
    do_not_claim: [production deployment, owned product roadmap, commercial launch]
  - id: claim_llm_review_120
    text: Reviewed 120 fictional medical-record responses from a language model for factual accuracy and hallucination risk.
    evidence_refs: [evaluation_table]
    tags: [llm, evaluation, hallucination, clinical safety, quality]
    metrics:
    - {id: metric_records_120, value: 120, unit: responses}
    paraphrases:
    - Evaluated factual accuracy and hallucination risk across 120 fictional medical-record responses generated by a language model.
    - Assessed 120 fictional LLM medical-record responses for factual errors and clinical-safety risks.
    do_not_claim: [model training, production monitoring, regulatory validation]
  - id: claim_clinician_interviews_8
    text: Conducted 8 structured interviews with fictional clinicians to identify workflow pain points and prioritize user needs.
    evidence_refs: [interview_notes]
    tags: [clinician, user research, interview, pain point, prioritization, product]
    metrics:
    - {id: metric_interviews_8, value: 8, unit: interviews}
    paraphrases:
    - Interviewed 8 fictional clinicians to surface workflow pain points and prioritize product needs.
    - Used 8 structured clinician interviews to identify user pain points and rank unmet needs.
    do_not_claim: [KOL management, customer sales, market research ownership]
  - id: claim_unverified_revenue
    text: Improved commercial conversion through AI-assisted workflow optimization.
    status: unverified
    visible: true
    evidence_refs: [evaluation_plan]
    tags: [business, product]
    do_not_claim: []
- id: project_requirement_mapper
  title: Clinical Requirement Mapping Prototype
  organization: Example Course Project
  category: project
  claims:
  - id: claim_mvp_mapping
    text: Mapped a clinician user journey and defined an MVP requirement set for a simulated healthcare AI evaluation workflow.
    evidence_refs: [course_report]
    tags: [user journey, mvp, healthcare, ai, product, requirement]
    paraphrases:
    - Turned a clinician user journey into an MVP requirement set for a simulated healthcare AI evaluation workflow.
    - Defined MVP scope from a mapped clinician journey for a simulated medical AI workflow.
    do_not_claim: [shipped product, commercial launch, owned roadmap]
  - id: claim_project_planning
    text: Maintained milestones, risks, and scope changes for a time-boxed prototype project and documented trade-off decisions.
    evidence_refs: [project_tracker]
    tags: [project, milestone, risk, scope, trade-off, planning, delivery]
    paraphrases:
    - Tracked prototype milestones, risks, scope changes, and trade-off decisions through delivery.
    - Managed a project tracker covering milestones, risks, scope changes, and documented trade-offs.
    do_not_claim: [program director, budget ownership, people management]
- id: project_traceable_pipeline
  title: Traceable Application Content Pipeline
  organization: Example Engineering Project
  category: project
  claims:
  - id: claim_python_pipeline
    text: Built a Python workflow that converts structured evidence into traceable application-ready content and audit artifacts.
    evidence_refs: [repository_commit, test_report]
    tags: [python, automation, pipeline, evidence, provenance, audit, workflow]
    paraphrases:
    - Built a traceable Python pipeline that transforms structured evidence into application-ready content and audit artifacts.
    - Automated evidence-to-content transformation in Python while preserving provenance and audit outputs.
    do_not_claim: [enterprise deployment, cloud platform ownership, production SLA]
  - id: claim_reproducibility
    text: Added versioned configuration, deterministic tests, and decision logs so repeated workflow runs could be reproduced and audited.
    evidence_refs: [config_history, test_report, decision_log]
    tags: [reproducibility, versioning, testing, traceability, audit, configuration]
    paraphrases:
    - Improved workflow reproducibility with versioned configuration, deterministic tests, and auditable decision logs.
    - Made repeated pipeline runs reproducible through configuration versioning, deterministic tests, and trace logs.
    do_not_claim: [regulated validation, ISO certification, production quality system]
- id: exp_scientific_communication
  title: Biomedical Research Trainee
  organization: Example Medical University
  category: experience
  claims:
  - id: claim_scientific_communication
    text: Synthesized biomedical literature into structured presentations and concise evidence summaries for research discussions.
    evidence_refs: [presentation_archive, literature_matrix]
    tags: [communication, evidence, literature, presentation, scientific writing]
    paraphrases:
    - Translated complex biomedical evidence into structured presentations and concise summaries for research discussions.
    - Communicated scientific evidence through clear presentations and concise literature summaries.
    do_not_claim: [KOL management, medical affairs ownership, external advisory board]
  - id: claim_literature_review_65
    text: Screened 65 fictional biomedical papers and organized findings into a structured evidence matrix for a research question.
    evidence_refs: [literature_matrix]
    tags: [literature, research, evidence, screening, synthesis]
    metrics:
    - {id: metric_papers_65, value: 65, unit: papers}
    paraphrases:
    - Reviewed 65 fictional biomedical papers and structured the findings in an evidence matrix.
    - Built a structured research evidence matrix after screening 65 fictional biomedical papers.
    do_not_claim: [systematic review publication, guideline authorship, regulatory submission]
  - id: claim_private_draft
    text: Drafted an internal experimental concept that is not approved for external use.
    status: verified
    visible: false
    evidence_refs: [presentation_archive]
    tags: [research]
    do_not_claim: []
- id: exp_data_insights
  title: Clinical Data Analysis Intern
  organization: Example Health Analytics Team
  category: experience
  claims:
