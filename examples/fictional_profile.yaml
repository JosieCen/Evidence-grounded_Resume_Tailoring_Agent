    text: Cleaned and analyzed 4,800 fictional de-identified records to identify usage patterns and summarize actionable findings.
    evidence_refs: [analysis_notebook]
    tags: [data, analysis, cleaning, insight, pattern, healthcare]
    metrics:
    - {id: metric_records_4800, value: 4800, unit: records}
    paraphrases:
    - Analyzed 4,800 fictional de-identified records to surface usage patterns and actionable insights.
    - Cleaned 4,800 fictional records and translated usage patterns into concise findings.
    do_not_claim: [predictive model deployment, causal inference, SQL database ownership]
  - id: claim_cross_functional
    text: Coordinated clinical, engineering, and design teammates around shared requirements, decision logs, and handoff issues.
    evidence_refs: [decision_log, project_tracker]
    tags: [cross-functional, stakeholder, communication, engineering, design, clinical, coordination]
    paraphrases:
    - Aligned clinical, engineering, and design teammates on requirements, decisions, and handoffs.
    - Facilitated cross-functional coordination across clinical, engineering, and design workstreams.
    do_not_claim: [direct reports, people management, executive leadership]
- id: exp_enablement
  title: Product Enablement Assistant
  organization: Example Digital Health Team
  category: experience
  claims:
  - id: claim_training_4_25
    text: Created training materials and delivered 4 fictional product-learning sessions for 25 internal participants.
    evidence_refs: [training_materials]
    tags: [training, enablement, communication, presentation, product]
    metrics:
    - {id: metric_sessions_4, value: 4, unit: sessions}
    - {id: metric_participants_25, value: 25, unit: participants}
    paraphrases:
    - Delivered 4 fictional product-training sessions to 25 internal participants using structured learning materials.
    - Created product enablement materials and trained 25 internal participants across 4 fictional sessions.
    do_not_claim: [sales training ownership, external customer certification, revenue enablement]
